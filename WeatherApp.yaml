# Weather Service

apiVersion: v1
kind: Service
metadata:
  name: weather-service
  labels:
    app: weather-service
spec:
  ports:
    - port: 8080 # Port that the service will expose
      targetPort: 8080 # Port that the container is listening on
  selector:
    app: weather-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  labels:
    app: weather-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
    spec:
      containers:
      - name: weather-service
        image: pablosaurio/weather-service:v1
        ports:
        - containerPort: 8080 # Port that the container is listening on
        env:
        - name: OPENWEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: weather-secret
              key: OPENWEATHER_API_KEY

---
