server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /weather {
        proxy_pass http://weather-service:8080;
    }

    location /getFavourites {
        proxy_pass http://favourites-service:8081;
    }

    location /addFavourite {
        proxy_pass http://favourites-service:8081;
    }

    location /removeFavourite {
        proxy_pass http://favourites-service:8081;
    }
}